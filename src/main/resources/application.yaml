spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/postgres}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    hikari:
      auto-commit: false
      schema: ${DATABASE_SCHEMA:analytics_service}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DATABASE_SCHEMA:analytics_service}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: ${DATABASE_SCHEMA:analytics_service}
    liquibase-schema: ${DATABASE_SCHEMA:analytics_service}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id:  ${KAFKA_ANALYTICS_GROUP_ID:analytics-group}
    topics:
      comment-topic:
        name: ${KAFKA_ANALYTICS_COMMENT_TOPIC:analytics_comment_topic}
      user-profile-view-topic:
        name:  ${KAFKA_ANALYTICS_USER_PROFILE_VIEW_TOPIC:analytics_user_view_profile_topic}

  data:
    redis:
      host: ${REDIS_URL:host.docker.internal}
      port: ${REDIS_PORT:6379}
      channel:
        profile-view: ${REDIS_PROFILE_VIEW_CHANEL:profile_view_channel}

springdoc:
  swagger-ui:
    enabled:  ${SWAGGERUI_ENABLED:true}
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

server:
  port: ${ANALYTICS_SERVICE_PORT:8086}

logging:
  level:
    root: info
    liquibase: info
    org.apache.kafka: info
    org.springframework.kafka: info
    org.testcontainers: info
    faang.school.analytics.listener: info

project-service:
  host: ${PROJECT_SERVICE_HOST:http://localhost}
  port: ${PROJECT_SERVICE_PORT:8082}

app:
  analytics:
    ingestion:
      max-future-skew: ${ANALYTICS_MAX_FUTURE_SKEW:5m}
      max-event-age: ${ANALYTICS_MAX_EVENT_AGE:365d}
  kafka:
    retry:
      max-attempts: ${KAFKA_ANALYTICS_RETRY_MAX_ATTEMPTS:3}
      backoff: ${KAFKA_ANALYTICS_RETRY_BACKOFF:1s}
    topics:
      analytics:
        like: ${KAFKA_ANALYTICS_LIKE_TOPIC:analytics_like_topic}
